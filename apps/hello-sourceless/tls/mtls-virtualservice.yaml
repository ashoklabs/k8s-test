apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hello-sourceless-mtls
  namespace: default
spec:
  hosts:
    - "hello-sourceless-mtls.default.example.com"
  gateways:
    - istio-system/hello-mtls-gateway
  http:
    - match:
        - authority:
            prefix: hello-sourceless-mtls.default.example.com
      route:
        - destination:
            host: hello-sourceless-svc.default.svc.cluster.local
            port:
              number: 80
          weight: 100
