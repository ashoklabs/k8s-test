# Knative Serving Core
# Installs: activator, autoscaler, controller, webhook.
# Depends on serving-crds being installed first (wave 5 > wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/knative/serving/releases/download/knative-v1.20.3/serving-core.yaml

patches:
  # Reduce resource requests for kind / dev environments
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
    target:
      kind: Deployment
      namespace: knative-serving
      name: activator
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
    target:
      kind: Deployment
      namespace: knative-serving
      name: autoscaler
