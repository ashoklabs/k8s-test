# istiod — Istio control plane (pilot, CA, injection webhook).
# Depends on istio-base CRDs (wave 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    # Helm chart from Istio release repo
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: istiod
      targetRevision: 1.29.2
      helm:
        releaseName: istiod
        valueFiles:
          - $values/infrastructure/istio/istiod/values.yaml
    # Values file from this git repo
    - repoURL: https://github.com/YOUR_ORG/K8s-test.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
