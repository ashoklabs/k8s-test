# ArgoCD Helm values
# Install ArgoCD via:
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm upgrade --install argocd argo/argo-cd \
#     --namespace argocd --create-namespace \
#     --version 7.8.26 \
#     -f argocd/bootstrap/argocd-values.yaml

configs:
  cm:
    # Allow kustomize to load ksops exec plugin for secret decryption
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

  params:
    server.insecure: true   # OK for kind/dev; remove for production with TLS

  # Create argocd-cmp-cm ConfigMap with ksops plugin definition
  cmp:
    create: true
    plugins:
      ksops:
        generate:
          command: ["sh", "-c"]
          args:
            - "kustomize build --enable-alpha-plugins --enable-exec ."

# ─── SOPS / ksops Config Management Plugin (CMP) ────────────────────────────
# The ksops sidecar mounts the AGE private key and runs ksops to decrypt
# SOPS-encrypted secrets before kustomize builds the manifests.
repoServer:
  serviceAccount:
    create: true
    name: argocd-repo-server

  # Extra volumes for the CMP working dir and the AGE private key secret
  volumes:
    - name: cmp-tmp
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age   # kubectl create secret generic sops-age ...
    - name: ksops-plugin-config
      configMap:
        name: argocd-cmp-cm    # created by configs.cmp.create above
        items:
          - key: ksops.yaml
            path: plugin.yaml

  extraContainers:
    - name: ksops-cmp
      # ksops image bundles: kustomize + ksops plugin + age + sops
      image: viaductoss/ksops:v4.3.2
      command: ["/var/run/argocd/argocd-cmp-server"]
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /sops-age/keys.agekey
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/config/
          name: ksops-plugin-config
        - mountPath: /home/argocd/cmp-server/plugins/
          name: plugins          # chart's default emptyDir shared with main container
        - mountPath: /home/argocd/cmp-tmp
          name: cmp-tmp
        - mountPath: /sops-age
          name: sops-age
          readOnly: true

server:
  # No resource requests — kind/dev cluster is memory-constrained
  resources: {}

controller:
  resources: {}

applicationSet:
  resources: {}
