name: Encrypt & Commit Secrets

# Trigger this workflow whenever cert source files change, or manually.
on:
  workflow_dispatch:
  push:
    paths:
      - 'certs/**'

permissions:
  contents: write

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sops
        uses: getsops/setup-sops@v1
        with:
          version: v3.9.0

      - name: Install age
        uses: AgeMage/setup-age@v1

      # Write the AGE private key from GitHub secrets
      - name: Write AGE key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_PRIVATE_KEY }}" > age.agekey

      - name: Encrypt certificate secrets
        run: |
          chmod +x scripts/encrypt-secrets.sh
          ./scripts/encrypt-secrets.sh
        env:
          SOPS_AGE_KEY_FILE: age.agekey

      # Shred the key from disk immediately after use
      - name: Remove AGE key
        if: always()
        run: shred -u age.agekey || rm -f age.agekey

      - name: Commit encrypted secrets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: re-encrypt certificate secrets [skip ci]"
          file_pattern: "apps/hello-sourceless/tls/secrets/*.enc.yaml"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
